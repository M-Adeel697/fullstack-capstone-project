<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GiftLink</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
  }
  .card {
    background: rgba(255,255,255,0.97);
    padding: 3rem 2.5rem;
    border-radius: 16px;
    text-align: center;
    max-width: 480px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
  }
  .logo {
    font-size: 2.8rem;
    margin-bottom: 0.5rem;
    color: #2563eb;
    font-weight: 800;
  }
  .tagline {
    font-size: 1.1rem;
    color: #4b5563;
    margin-bottom: 2rem;
    line-height: 1.5;
  }
  .get-started-btn {
    padding: 0.9rem 2.2rem;
    font-size: 1.1rem;
    font-weight: bold;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
  }
  .get-started-btn:hover {
    background: #1d4ed8;
    transform: translateY(-2px);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">🎁 GiftLink</div>
    <p class="tagline">
      Give what you don't need. Find what you do.<br>
      Connect with your community to give away and discover free household items.
    </p>
    <button class="get-started-btn" onclick="alert('Welcome to GiftLink! Sign up to get started.')">
      Get Started
    </button>
  </div>
</body>
</html>
